<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Rounded Shield / Tile -->
  <rect width="64" height="64" rx="16" fill="url(#grad)" />
  
  <!-- City Skyline Silhouette -->
  <!-- Left Building -->
  <rect x="12" y="28" width="10" height="26" rx="2" fill="#ffffff" fill-opacity="0.9" />
  <rect x="14" y="32" width="2" height="3" rx="0.5" fill="#2563EB" />
  <rect x="18" y="32" width="2" height="3" rx="0.5" fill="#2563EB" />
  <rect x="14" y="38" width="2" height="3" rx="0.5" fill="#2563EB" />
  <rect x="18" y="38" width="2" height="3" rx="0.5" fill="#2563EB" />
  <rect x="14" y="44" width="2" height="3" rx="0.5" fill="#2563EB" />
  <rect x="18" y="44" width="2" height="3" rx="0.5" fill="#2563EB" />

  <!-- Center Tower / High-rise with Spire -->
  <rect x="25" y="16" width="14" height="38" rx="2" fill="#ffffff" />
  <line x1="32" y1="9" x2="32" y2="16" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
  <circle cx="32" cy="8" r="1.5" fill="#38BDF8" />
  <!-- Center windows -->
  <rect x="28" y="21" width="3" height="4" rx="0.5" fill="#4F46E5" />
  <rect x="33" y="21" width="3" height="4" rx="0.5" fill="#4F46E5" />
  <rect x="28" y="28" width="3" height="4" rx="0.5" fill="#4F46E5" />
  <rect x="33" y="28" width="3" height="4" rx="0.5" fill="#4F46E5" />
  <rect x="28" y="35" width="3" height="4" rx="0.5" fill="#4F46E5" />
  <rect x="33" y="35" width="3" height="4" rx="0.5" fill="#4F46E5" />
  <rect x="28" y="42" width="3" height="4" rx="0.5" fill="#4F46E5" />
  <rect x="33" y="42" width="3" height="4" rx="0.5" fill="#4F46E5" />

  <!-- Right Building -->
  <rect x="42" y="24" width="10" height="30" rx="2" fill="#ffffff" fill-opacity="0.9" />
  <rect x="44" y="28" width="2" height="3" rx="0.5" fill="#2563EB" />
  <rect x="48" y="28" width="2" height="3" rx="0.5" fill="#2563EB" />
  <rect x="44" y="35" width="2" height="3" rx="0.5" fill="#2563EB" />
  <rect x="48" y="35" width="2" height="3" rx="0.5" fill="#2563EB" />
  <rect x="44" y="42" width="2" height="3" rx="0.5" fill="#2563EB" />
  <rect x="48" y="42" width="2" height="3" rx="0.5" fill="#2563EB" />

  <!-- AI Sparkle / Circuit node at top left -->
  <path d="M16 11 L17 14 L20 15 L17 16 L16 19 L15 16 L12 15 L15 14 Z" fill="#FDE047" />
  <!-- AI Sparkle at top right -->
  <path d="M48 10 L49 13 L52 14 L49 15 L48 18 L47 15 L44 14 L47 13 Z" fill="#38BDF8" />

  <!-- Smart Signal Waves above center tower -->
  <path d="M26 13 A7 7 0 0 1 38 13" fill="none" stroke="#67E8F9" stroke-width="1.5" stroke-linecap="round" />
